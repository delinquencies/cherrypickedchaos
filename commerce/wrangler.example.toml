name = "cherry-picked-chaos-store"
main = "src/worker.mjs"
compatibility_date = "2026-11-09"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# Match the Cloudflare Access allowlist. Separate multiple email addresses with commas.
STORE_ADMIN_EMAIL = "mdbarton81@gmail.com"
ACCESS_ISSUER = "https://YOUR-TEAM.cloudflareaccess.com"
ACCESS_AUDIENCE = "REPLACE_WITH_ACCESS_APPLICATION_AUD"

[[d1_databases]]
binding = "STORE_DB"
database_name = "cherry-picked-chaos-store"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
